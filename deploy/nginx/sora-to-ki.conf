# Example nginx config for sora-to-ki: put it in /etc/nginx/sites-available/, replace example.com and
# /srv/sora-to-ki, then `ln -s` it into sites-enabled and `nginx -t && systemctl reload nginx`.
# Leave HTTPS to certbot:
#   certbot --nginx -d example.com
# which adds the listen 443 and certificate lines to this file. See README.md in this folder.
#
# Routing matches the bundled Caddy (.config/Caddyfile):
#   /api/, /rss      → backend (127.0.0.1:3002)
#   /uploads/        → files uploaded in the admin (read straight from the host folder)
#   /nas-images/     → photo page thumbnails
#   everything else  → frontend (127.0.0.1:13579)
#
# ⚠ The CSP is copied from scripts/csp.mjs: change the policy in csp.mjs first, then paste what
#   `node scripts/csp.mjs` prints below. scripts/caddyfile.test.ts compares them.

server {
    listen 80;
    server_name example.com;

    # Upload limit for images and videos in the admin (the backend itself stops at 50 MB)
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    include /etc/nginx/snippets/sora-to-ki-security.conf;

    # Source maps are already deleted at build time; block them here once more
    location ~ \.map$ {
        return 404;
    }

    # Always set X-Forwarded-For to $remote_addr, never $proxy_add_x_forwarded_for: the backend takes its
    # first value as the reader's IP (comment blocklist, daily limit on friend requests), and if it keeps
    # whatever the client sent, anyone can pretend to be someone else

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files are stored as-is and uploads don't check extensions, so an evil.svg opened directly
    # would run its script. default-src 'none' leaves a directly opened SVG/HTML unable to do anything;
    # embedding with <img> is unaffected
    location /uploads/ {
        alias /srv/sora-to-ki/storage/uploads/;
        autoindex off;
        expires 30d;
        include /etc/nginx/snippets/sora-to-ki-security.conf;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location /nas-images/ {
        alias /srv/sora-to-ki/storage/gallery/;
        autoindex off;
        expires 30d;
        include /etc/nginx/snippets/sora-to-ki-security.conf;
        add_header Cache-Control "public, no-transform";
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location / {
        proxy_pass http://127.0.0.1:13579;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/sora-to-ki-security.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org https://media.themoviedb.org https://i.scdn.co https://img.youtube.com https://p2.bahamut.com.tw https://cdn.cloudflare.steamstatic.com https://community.akamai.steamstatic.com https://shared.akamai.steamstatic.com https://avatars.githubusercontent.com https://lh3.googleusercontent.com; media-src 'self' blob: https://shared.akamai.steamstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.bilibili.com https://open.spotify.com; font-src 'self' data:; connect-src 'self' https://shared.akamai.steamstatic.com; worker-src 'self' blob:; manifest-src 'self'; report-uri /api/csp-report" always;
    }
}
