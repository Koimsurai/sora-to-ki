# sora-to-ki 的 nginx 設定範例：放進 /etc/nginx/sites-available/，改掉 example.com 與 /srv/sora-to-ki，
# 再 `ln -s` 到 sites-enabled、`nginx -t && systemctl reload nginx`。HTTPS 交給 certbot：
#   certbot --nginx -d example.com
# 它會在這份裡補上 listen 443 與憑證那幾行。說明見同資料夾的 README.md。
#
# 分流跟內建的 Caddy（.config/Caddyfile）一樣：
#   /api/、/rss      → 後端（127.0.0.1:3002）
#   /uploads/        → 後台上傳的檔案（直接讀主機上的資料夾）
#   /nas-images/     → 照片頁的縮圖
#   其他             → 前端（127.0.0.1:13579）
#
# ⚠ CSP 是從 scripts/csp.mjs 抄的：改政策先改 csp.mjs，再 `node scripts/csp.mjs` 印出來貼到下面。
#   scripts/caddyfile.test.ts 會比對，抄錯就紅。

server {
    listen 80;
    server_name example.com;

    # 後台上傳圖片與影片的上限（後端自己擋在 50 MB）
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    include /etc/nginx/snippets/sora-to-ki-security.conf;

    # 建置時已經刪掉 .map，這裡再擋一次
    location ~ \.map$ {
        return 404;
    }

    # X-Forwarded-For 一律寫成 $remote_addr，不要用 $proxy_add_x_forwarded_for：
    # 後端拿它的第一個值當讀者的 IP（留言黑名單、朋友申請一天幾份），沿用讀者自己帶來的話，誰都能假裝成別人

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 使用者上傳、原樣落地的檔案：上傳不檢查副檔名，evil.svg 存得進來，被直接開啟時會執行 script。
    # default-src 'none' 讓直接開啟的 SVG/HTML 什麼都做不了；用 <img> 嵌入不受影響
    location /uploads/ {
        alias /srv/sora-to-ki/storage/uploads/;
        autoindex off;
        expires 30d;
        include /etc/nginx/snippets/sora-to-ki-security.conf;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location /nas-images/ {
        alias /srv/sora-to-ki/storage/gallery/;
        autoindex off;
        expires 30d;
        include /etc/nginx/snippets/sora-to-ki-security.conf;
        add_header Cache-Control "public, no-transform";
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location / {
        proxy_pass http://127.0.0.1:13579;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/sora-to-ki-security.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org https://media.themoviedb.org https://i.scdn.co https://img.youtube.com https://p2.bahamut.com.tw https://cdn.cloudflare.steamstatic.com https://community.akamai.steamstatic.com https://shared.akamai.steamstatic.com https://avatars.githubusercontent.com https://lh3.googleusercontent.com; media-src 'self' blob: https://shared.akamai.steamstatic.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.bilibili.com https://open.spotify.com; font-src 'self' data:; connect-src 'self' https://shared.akamai.steamstatic.com; worker-src 'self' blob:; manifest-src 'self'; report-uri /api/csp-report" always;
    }
}
