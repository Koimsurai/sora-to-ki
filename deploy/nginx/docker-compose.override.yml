# Override for a host that already runs nginx: copy it to the repo root (next to docker-compose.yml)
# and compose layers it on top automatically. See README.md in this folder.
#
# - The bundled Caddy doesn't start (a service whose profile isn't enabled stays down)
# - Frontend and backend publish ports on localhost only; nginx proxies to them
# - Admin uploads and photo thumbnails move from docker volumes to host folders, so nginx can read and
#   serve the files directly

services:
  caddy:
    profiles: ["caddy"]

  frontend:
    ports:
      - "127.0.0.1:13579:13579"

  backend-rs:
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      # Same container paths as in docker-compose.yml: compose merges by container path, so these two
      # lines replace the original volumes
      - ./storage/uploads:/usr/src/app/storage/uploads
      - ./storage/gallery:/usr/src/app/storage/gallery
