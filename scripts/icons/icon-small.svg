<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 16 / 32px 專用：同一個構圖，去掉星點與漸層細節，形狀放大、對齊像素 -->
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#e0559a"/>
    </linearGradient>
    <mask id="cres">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="18" cy="8.5" r="8" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7" fill="#161038"/>
  <circle cx="12" cy="13" r="10" fill="url(#moon)" mask="url(#cres)"/>
  <circle cx="21.3" cy="17.5" r="6" fill="#d6c8ff" stroke="#161038" stroke-width="2" paint-order="stroke"/>
  <rect x="20" y="21" width="2.6" height="8" rx="1" fill="#d6c8ff"/>
</svg>
