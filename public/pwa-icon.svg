<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 宙と木：一彎新月，前面一棵樹 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a58"/>
      <stop offset="1" stop-color="#0a0718"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="0.55" stop-color="#e0a3f0"/>
      <stop offset="1" stop-color="#dc3278"/>
    </linearGradient>
    <mask id="cres">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="35" cy="17" r="15.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 新月（比初版粗，16px 時才不會只剩一條線） -->
  <circle cx="24" cy="26" r="18" fill="url(#moon)" mask="url(#cres)"/>
  <!-- 小星 -->
  <circle cx="49" cy="12" r="1.8" fill="#f3e8ff"/>
  <circle cx="55" cy="22" r="1.2" fill="#f3e8ff" opacity="0.8"/>
  <!-- 樹冠：深色描邊把它跟月亮切開 -->
  <path d="M34 33 C 32.5 27 38 23 42.5 25.8 C 47 23 52.5 27 51 33 C 55 37.5 51.5 44 42.5 44 C 33.5 44 30 37.5 34 33 Z"
        fill="#c4b5fd" stroke="#0a0718" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"/>
  <!-- 樹幹畫在樹冠之後、不描邊，才會接進樹冠裡（反過來會在兩者之間留一道深色縫） -->
  <rect x="40.3" y="39" width="4.4" height="18" rx="1.8" fill="#c4b5fd"/>
</svg>
