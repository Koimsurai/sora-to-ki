<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 同 tab-planet.svg 的那顆星球與衛星，放在站上的底色上（PWA、iOS 主畫面、Google 搜尋用；這些地方不跟著主題換色）。
       gen-icons.mjs 會拿掉圓角做 apple-touch-icon、縮到 78% 做可遮罩的版本 -->
  <style>.s { fill: #f1ece3; }</style>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <g transform="translate(9 9) scale(1.4375)">
  <defs>
    <clipPath id="ball"><circle cx="15" cy="17" r="14.4"/></clipPath>
    <!-- 衛星周圍留一圈縫，星球的刷痕不貼著它 -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="26.6" cy="5.4" r="5.2" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <g class="s" clip-path="url(#ball)" transform="rotate(-18 15 17)">
      <rect x="-4" y="1.90" width="40" height="3.0"/>
      <rect x="-4" y="5.90" width="40" height="3.8"/>
      <rect x="-4" y="10.20" width="40" height="4.0"/>
      <rect x="-4" y="14.80" width="40" height="3.6"/>
      <rect x="-4" y="19.50" width="40" height="3.0"/>
      <rect x="-4" y="24.30" width="40" height="2.2"/>
      <rect x="-4" y="29.15" width="40" height="1.3"/>
    </g>
  </g>
  <circle cx="26.6" cy="5.4" r="3.1" fill="#e9c17a"/>
  </g>
</svg>
