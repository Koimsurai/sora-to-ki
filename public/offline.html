<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>離線中 · 宙と木</title>
    <!--
      刻意是「純靜態 HTML、零 JS 框架」。
      不能拿 TanStack 的 /offline 路由當離線 fallback:那產出的是完整 SPA 文件,
      SW 把它回給 /blog 之類的導覽後,client 會 hydrate → router 依網址重跑該路由的 loader
      → 斷網下直接變成 "Failed to fetch",離線頁等於被自己的 router 蓋掉。(已實測踩過)

      版面跟 404（layout/NotFound）同一套：黑底、紙色的宋體字、琥珀點、等寬字的虛線按鈕。
      離線時拿不到站上的 CSS 與字型，顏色直接寫值（同 index.css 的 --ground、--paper、--amber），
      字型只用本機有的。改了這一頁要一起換 sw.js 的 CACHE，回訪的人才會拿到新版

      圖：衛星繞到地球背面就跟地面失聯（太空任務說的 LOS），繞回來才又收得到。
      全部是 SVG 自己的動畫（animateMotion），不靠 JS、不另外抓檔案。
      衛星畫兩份：一份在地球底下（繞到背面時被地球蓋住），一份在地球上面但只露出前半圈
    -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; gap: 48px;
        padding: 24px max(40px, calc(50% - 640px));
        box-sizing: border-box;
        background: #0a0a0c; color: #f1ece3;
        font-family: "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "PMingLiU", serif;
      }
      main { display: grid; gap: 12px; max-width: 520px; flex: none; }
      .code {
        font-family: "Instrument Serif", "Noto Serif TC", serif;
        font-size: 56px; line-height: 1; color: rgba(241, 236, 227, 0.7);
      }
      h1 { margin: 0; font-size: 32px; font-weight: 600; line-height: 1.3; }
      p { margin: 0; font-size: 16px; line-height: 1.6; color: rgba(241, 236, 227, 0.7); }
      .mono {
        font-family: "Fira Code", "JetBrains Mono", "SF Mono", ui-monospace, Consolas, monospace;
        font-size: 12px; letter-spacing: 0.04em;
      }
      .status { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: rgba(241, 236, 227, 0.4); }
      .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #e9c17a; box-shadow: 0 0 8px rgba(233, 193, 122, 0.6);
        animation: blink 2.4s ease-in-out infinite;
      }
      @keyframes blink { 50% { opacity: 0.25; } }
      button {
        all: unset; box-sizing: border-box; cursor: pointer;
        justify-self: start; margin-top: 16px; padding-bottom: 2px;
        color: rgba(241, 236, 227, 0.7);
        border-bottom: 1px dotted rgba(241, 236, 227, 0.4);
        transition: color 0.2s ease, border-color 0.2s ease;
      }
      button:hover, button:focus-visible { color: #e9c17a; border-bottom-color: #e9c17a; }
      .sky { flex: 1; min-width: 0; max-width: 620px; margin-left: auto; }
      .sky svg { display: block; width: 100%; height: auto; overflow: visible; }
      .still { display: none; }
      @media (max-width: 900px) {
        body { flex-direction: column-reverse; justify-content: center; align-items: stretch; gap: 24px; padding: 24px 20px; }
        .sky { margin: 0 auto; width: 100%; max-width: 420px; flex: none; }
        h1 { font-size: 26px; } .code { font-size: 44px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
        .moving { display: none; }
        .still { display: inline; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">Offline</div>
      <h1>目前處於離線狀態</h1>
      <p>連線恢復後重新整理即可繼續瀏覽。</p>
      <div class="status mono"><span class="dot" aria-hidden="true"></span>宙と木 · 等待訊號</div>
      <button class="mono" type="button" onclick="location.reload()">重新整理 ↻</button>
    </main>
    <div class="sky" aria-hidden="true">
      <svg viewBox="0 0 420 240" fill="none">
        <defs>
          <!-- 軌道：從最右邊往下繞前半圈、再從上面繞到地球背面。前半圈 0–50%、背面約 67–83% 被地球擋住 -->
          <path id="orbit" d="M380 120 A170 42 0 0 1 40 120 A170 42 0 0 1 380 120" />
          <!-- 地球的下半部前面：前半圈的軌道與衛星畫在地球上面，只露出這一塊 -->
          <clipPath id="front"><rect x="0" y="120" width="420" height="120" /></clipPath>
          <clipPath id="back"><rect x="0" y="-40" width="420" height="160" /></clipPath>
          <radialGradient id="lit" cx="0.32" cy="0.3" r="0.8">
            <stop offset="0" stop-color="#f1ece3" stop-opacity="0.1" />
            <stop offset="1" stop-color="#f1ece3" stop-opacity="0" />
          </radialGradient>
          <!-- 衛星：機身加兩片太陽能板 -->
          <g id="sat" stroke="#f1ece3" stroke-width="1.2">
            <rect x="-2.2" y="-2.2" width="4.4" height="4.4" fill="#f1ece3" stroke="none" />
            <path d="M-9 0H-3.5M3.5 0H9" />
          </g>
          <!-- 訊號：一圈一圈往外擴散。繞到背面前淡掉，繞出來後再亮 -->
          <g id="signal">
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
              values="1;1;0;0;1;1" keyTimes="0;0.6;0.64;0.85;0.89;1" />
            <circle r="4" stroke="#e9c17a" stroke-width="1">
              <animate attributeName="r" values="4;22" dur="1.8s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite" />
            </circle>
            <circle r="4" stroke="#e9c17a" stroke-width="1">
              <animate attributeName="r" values="4;22" dur="1.8s" begin="0.9s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0.7;0" dur="1.8s" begin="0.9s" repeatCount="indefinite" />
            </circle>
          </g>
        </defs>

        <!-- 軌道（整圈，背面那段之後會被地球蓋住） -->
        <use href="#orbit" stroke="#f1ece3" stroke-opacity="0.25" stroke-dasharray="1 4" />

        <!-- 衛星在地球底下的那一份：只露出上半（背面那一側），前半圈交給上面那一份，兩份不重疊 -->
        <!-- （裁切掛在外面這層不動的 g：掛在帶 animateMotion 的那層上，裁切框會跟著衛星走） -->
        <g clip-path="url(#back)">
          <g class="moving">
            <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbit" /></animateMotion>
            <use href="#signal" />
            <use href="#sat" />
          </g>
        </g>

        <!-- 地球：跟頁面同色的實心圓，蓋住背面的軌道與衛星；左上迎光 -->
        <circle cx="210" cy="120" r="58" fill="#0a0a0c" />
        <circle cx="210" cy="120" r="58" fill="url(#lit)" stroke="#f1ece3" stroke-opacity="0.45" />
        <!-- 台灣：地面站 -->
        <circle cx="236" cy="98" r="2.2" fill="#e9c17a" />

        <!-- 前半圈：軌道與衛星畫在地球前面 -->
        <g clip-path="url(#front)">
          <use href="#orbit" stroke="#f1ece3" stroke-opacity="0.25" stroke-dasharray="1 4" />
          <g class="moving">
            <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbit" /></animateMotion>
            <use href="#signal" />
            <use href="#sat" />
          </g>
        </g>

        <!-- 減少動態效果：停在前半圈、正在發訊號的那一刻 -->
        <g class="still" transform="translate(300 152)">
          <circle r="10" stroke="#e9c17a" stroke-opacity="0.5" />
          <use href="#sat" />
        </g>
      </svg>
    </div>
  </body>
</html>
