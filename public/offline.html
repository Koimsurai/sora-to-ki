<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>離線中 · 宙と木</title>
    <!--
      刻意是「純靜態 HTML、零 JS 框架」。
      不能拿 TanStack 的 /offline 路由當離線 fallback:那產出的是完整 SPA 文件,
      SW 把它回給 /blog 之類的導覽後,client 會 hydrate → router 依網址重跑該路由的 loader
      → 斷網下直接變成 "Failed to fetch",離線頁等於被自己的 router 蓋掉。(已實測踩過)

      版面跟 404（layout/NotFound）同一套：黑底、紙色的宋體字、琥珀點、等寬字的虛線按鈕。
      離線時拿不到站上的 CSS 與字型，顏色直接寫值（同 index.css 的 --ground、--paper、--amber），
      字型只用本機有的。改了這一頁要一起換 sw.js 的 CACHE，回訪的人才會拿到新版
    -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center;
        padding: 24px max(40px, calc(50% - 640px));
        box-sizing: border-box;
        background: #0a0a0c; color: #f1ece3;
        font-family: "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "PMingLiU", serif;
      }
      main { display: grid; gap: 12px; max-width: 520px; }
      .code {
        font-family: "Instrument Serif", "Noto Serif TC", serif;
        font-size: 56px; line-height: 1; color: rgba(241, 236, 227, 0.7);
      }
      h1 { margin: 0; font-size: 32px; font-weight: 600; line-height: 1.3; }
      p { margin: 0; font-size: 16px; line-height: 1.6; color: rgba(241, 236, 227, 0.7); }
      .mono {
        font-family: "Fira Code", "JetBrains Mono", "SF Mono", ui-monospace, Consolas, monospace;
        font-size: 12px; letter-spacing: 0.04em;
      }
      .status { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: rgba(241, 236, 227, 0.4); }
      .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #e9c17a; box-shadow: 0 0 8px rgba(233, 193, 122, 0.6);
        animation: blink 2.4s ease-in-out infinite;
      }
      @keyframes blink { 50% { opacity: 0.25; } }
      button {
        all: unset; box-sizing: border-box; cursor: pointer;
        justify-self: start; margin-top: 16px; padding-bottom: 2px;
        color: rgba(241, 236, 227, 0.7);
        border-bottom: 1px dotted rgba(241, 236, 227, 0.4);
        transition: color 0.2s ease, border-color 0.2s ease;
      }
      button:hover, button:focus-visible { color: #e9c17a; border-bottom-color: #e9c17a; }
      @media (max-width: 768px) { body { padding: 24px 20px; } h1 { font-size: 26px; } .code { font-size: 44px; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">Offline</div>
      <h1>目前處於離線狀態</h1>
      <p>連線恢復後重新整理即可繼續瀏覽。</p>
      <div class="status mono"><span class="dot" aria-hidden="true"></span>宙と木 · 等待訊號</div>
      <button class="mono" type="button" onclick="location.reload()">重新整理 ↻</button>
    </main>
  </body>
</html>
