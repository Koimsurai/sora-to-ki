# Self-hosting stack: reverse proxy (Caddy), frontend, backend, daily backup. `docker compose up -d` runs it.
#
# Settings live in two files (neither is committed; templates are .env.example and .env.backend.example):
#   .env          site settings (URL, name, author, public address). Compose reads it for ${} substitution;
#                 frontend and backend share it
#   .env.backend  backend secrets and integrations (GitHub, Simkl, Resend…). Integrations left unset stay off
#
# Only Caddy is exposed (80/443); frontend and backend open no host ports. If the host already runs nginx,
# use deploy/nginx/ instead (a ready-made override and server block). For any other reverse proxy, turn
# caddy off in docker-compose.override.yml, publish the frontend and backend ports, and route the way
# .config/Caddyfile does.
#
# To add things (host folders, extra networks, other services), write them in docker-compose.override.yml;
# compose layers it on top automatically, so this file stays untouched. When replacing a list such as
# `ports`, use `!override`, otherwise both sets are kept.

volumes:
  backend-db-data: # the DB file (shared by backend-rs and db-backup)
  backend-uploads: # images uploaded in the admin (Caddy serves /uploads/ straight from it)
  backend-gallery: # thumbnails and manifest for the photos page (Caddy serves /nas-images/ from it)
  revalidate-key: # cache-purge secret shared by frontend and backend (generated by the backend on first boot when .env leaves REVALIDATE_SECRET empty)
  caddy-data: # HTTPS certificates; delete it and they are requested again on next boot
  caddy-config:

services:
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      # Public address: a domain (automatic HTTPS), or :80 if you have none
      - CADDY_ADDRESS=${CADDY_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./.config/Caddyfile:/etc/caddy/Caddyfile:ro
      - backend-uploads:/srv/uploads:ro
      - backend-gallery:/srv/gallery:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - frontend
      - backend-rs

  frontend:
    # Normally pulls the released image (.github/workflows/release.yml); `up --build` builds from source
    # and tags the result with this same name. Build-time settings such as Sentry or Plausible need your own build
    image: ghcr.io/koimsurai/sora-to-ki/frontend:${SORA_TO_KI_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Error reporting (Sentry-compatible, e.g. GlitchTip). Empty = no reporting
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_RELEASE=${VITE_RELEASE:-}
        # Plausible analytics: the pa-XXXX.js URL from the admin snippet. Empty = no tracking script
        - VITE_PLAUSIBLE_SCRIPT=${VITE_PLAUSIBLE_SCRIPT:-}
    environment:
      - TZ=${TZ:-UTC}
      - BACKEND_URL=http://backend-rs:3002
      - SITE_URL=${SITE_URL:-http://localhost}
      # After a post or the site settings change, backend-rs calls /_revalidate to purge the ISR cache
      # instead of waiting for the TTL (1h for posts). Without a secret, the one the backend generated
      # into revalidate-key is used
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      - REVALIDATE_SECRET_FILE=/run/revalidate/secret
    volumes:
      - revalidate-key:/run/revalidate:ro
    restart: unless-stopped
    healthcheck:
      # the slim image has no curl/wget, so use node's built-in fetch on the home page
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:13579/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend-rs:
        condition: service_healthy

  backend-rs:
    image: ghcr.io/koimsurai/sora-to-ki/backend:${SORA_TO_KI_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_URL=sqlite:///usr/src/app/db/db.sqlite
      - BIND_ADDR=0.0.0.0:3002
      - RUST_LOG=info,koimsurai_web_backend=info
      # Site identity (backend/src/identity.rs): used by RSS, emails and share images
      - SITE_URL=${SITE_URL:-http://localhost}
      - SITE_NAME=${SITE_NAME:-}
      - SITE_AUTHOR=${SITE_AUTHOR:-}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-}
      - SITE_EMAIL=${SITE_EMAIL:-}
      - SITE_GITHUB=${SITE_GITHUB:-}
      - SITE_DEFAULT_LOCALE=${SITE_DEFAULT_LOCALE:-}
      - SITE_LOCALES=${SITE_LOCALES:-}
      # Tell the frontend to purge its ISR cache when content changes (fire-and-forget; a failure only
      # warns, worst case you wait for the TTL). 13579 = the frontend's internal port (Dockerfile
      # ENV PORT=13579). Both sides must use the same secret.
      - FRONTEND_REVALIDATE_URL=http://frontend:13579/_revalidate
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      - REVALIDATE_SECRET_FILE=/run/revalidate/secret
      #
      # ⚠️ Secrets (GITHUB_TOKEN, SIMKL_CLIENT_ID…) go in .env.backend. Do **not** add
      # `- SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}` here: `environment` wins over `env_file`, and `${VAR:-}`
      # reads .env (which has no such key), so the real value from .env.backend gets overwritten with "".
    volumes:
      - backend-db-data:/usr/src/app/db
      - backend-uploads:/usr/src/app/storage/uploads
      - backend-gallery:/usr/src/app/storage/gallery
      - revalidate-key:/run/revalidate
    env_file:
      - ./.env.backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Daily online SQLite backup (VACUUM INTO snapshot + gzip + rotation by age), written to ./backups.
  # alpine installs sqlite on boot (its only runtime dependency) and runs scripts/backup-db.sh.
  db-backup:
    image: alpine:3.20
    environment:
      - TZ=${TZ:-UTC}
      - BACKUP_INTERVAL_SECONDS=86400
      - BACKUP_KEEP_DAYS=14
    volumes:
      - backend-db-data:/db # shared with backend-rs (WAL allows readers in several processes)
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && exec /bin/sh /backup-db.sh"]
    restart: unless-stopped
