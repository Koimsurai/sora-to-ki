# 自架用的組合：反向代理（Caddy）、前端、後端、每日備份。`docker compose up -d` 就能跑。
#
# 設定分兩個檔（都不提交，範本見 .env.example 與 .env.backend.example）：
#   .env          站台設定（網址、站名、作者、對外位址），compose 自己讀來做 ${} 替換，前後端共用
#   .env.backend  後端的金鑰與各個整合（GitHub、Simkl、Resend…），沒設的整合就不啟用
#
# 對外只有 Caddy（80／443），前後端不對主機開 port。已經有自己的反向代理（nginx…）的話，
# 在 docker-compose.override.yml 把 caddy 關掉、替前後端開 port，分流照 .config/Caddyfile。
#
# 要加東西（主機上的資料夾、其他網路、別的服務）就寫在 docker-compose.override.yml，
# compose 會自動疊上去，不必改這個檔。改掉 ports 這類清單時用 `!override`，不然會變成兩組都留。

volumes:
  backend-db-data: # DB 檔（backend-rs 與 db-backup 共用）
  backend-uploads: # 後台上傳的圖片（Caddy 直接讀它出 /uploads/）
  backend-gallery: # 照片頁產生的縮圖與 manifest（Caddy 直接讀它出 /nas-images/）
  caddy-data: # HTTPS 憑證，刪掉的話下次開機會重新申請
  caddy-config:

services:
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      # 對外位址：有網域就填網域（自動 HTTPS），沒有就 :80
      - CADDY_ADDRESS=${CADDY_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./.config/Caddyfile:/etc/caddy/Caddyfile:ro
      - backend-uploads:/srv/uploads:ro
      - backend-gallery:/srv/gallery:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - frontend
      - backend-rs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 錯誤上報（Sentry 相容，例如 GlitchTip）。空 = 不上報
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_RELEASE=${VITE_RELEASE:-}
        # Plausible 分析：後台 snippet 裡的 pa-XXXX.js 網址。空 = 不掛追蹤腳本
        - VITE_PLAUSIBLE_SCRIPT=${VITE_PLAUSIBLE_SCRIPT:-}
    environment:
      - TZ=${TZ:-UTC}
      - BACKEND_URL=http://backend-rs:3002
      - SITE_URL=${SITE_URL:-http://localhost}
      # 發文/改文後 backend-rs 會打 /_revalidate 清 ISR 快取，不必等 TTL（文章頁 1h）。
      # 沒設 = 端點回 404、功能不啟用。
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
    restart: unless-stopped
    healthcheck:
      # slim image 沒有 curl/wget → 用 node 內建 fetch 打首頁
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:13579/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend-rs:
        condition: service_healthy

  backend-rs:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_URL=sqlite:///usr/src/app/db/db.sqlite
      - BIND_ADDR=0.0.0.0:3002
      - RUST_LOG=info,koimsurai_web_backend=info
      # 站台身分（backend/src/identity.rs）：RSS、信件、分享圖都用它
      - SITE_URL=${SITE_URL:-http://localhost}
      - SITE_NAME=${SITE_NAME:-}
      - SITE_AUTHOR=${SITE_AUTHOR:-}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-}
      - SITE_EMAIL=${SITE_EMAIL:-}
      - SITE_GITHUB=${SITE_GITHUB:-}
      # 文章內容變更後通知前端清 ISR 快取（fire-and-forget，失敗只會 warn，最壞就是等 TTL）。
      # 13579 = 前端容器內部 port（Dockerfile ENV PORT=13579）。兩邊密鑰必須相同。
      - FRONTEND_REVALIDATE_URL=http://frontend:13579/_revalidate
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      #
      # ⚠️ 金鑰類（GITHUB_TOKEN、SIMKL_CLIENT_ID…）放 .env.backend，**不要**在這裡寫
      # `- SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}`：`environment` 優先於 `env_file`，而 `${VAR:-}`
      # 讀的是 .env（那裡沒有這些鍵），結果會用空字串蓋掉 .env.backend 裡的真值。
    volumes:
      - backend-db-data:/usr/src/app/db
      - backend-uploads:/usr/src/app/storage/uploads
      - backend-gallery:/usr/src/app/storage/gallery
    env_file:
      - ./.env.backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # SQLite 每日線上備份（VACUUM INTO 快照 + gzip + 依天數輪替），寫到 ./backups。
  # alpine 開機裝 sqlite（唯一執行期依賴），跑 scripts/backup-db.sh。
  db-backup:
    image: alpine:3.20
    environment:
      - TZ=${TZ:-UTC}
      - BACKUP_INTERVAL_SECONDS=86400
      - BACKUP_KEEP_DAYS=14
    volumes:
      - backend-db-data:/db # 與 backend-rs 共用（WAL 支援多程序讀）
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && exec /bin/sh /backup-db.sh"]
    restart: unless-stopped
