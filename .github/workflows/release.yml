# 發版：推 v* tag（例如 v0.1.0）就建好前後端映像推到 GHCR，再開一則 GitHub Release。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 映像：ghcr.io/koimsurai/sora-to-ki/frontend、…/backend，標籤是 0.1.0、0.1 與 latest。
# 自架的人 `docker compose up -d` 就直接拉這兩個（docker-compose.yml 的 image:），不必自己編 Rust。
# Release 的說明用 GitHub 依 PR 標題自動產生的清單（conventional commit 的標題本來就寫得像更新紀錄）。
#
# ⚠ 預先建好的前端映像**不帶** Sentry 與 Plausible：那兩個是 VITE_ 開頭、建置時烤進 bundle 的，
#   每個站都不一樣。要用的人改走 `docker compose up -d --build` 自己建。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: 映像 · ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: frontend
            dockerfile: Dockerfile
          - image: backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 映像位址只收小寫；tag 拆成 0.1.0 / 0.1 / latest。預覽版（v0.2.0-rc.1）不動 latest 與 0.2
      - name: 映像位址與標籤
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          name="ghcr.io/$repo/$IMAGE"
          version="${TAG#v}"
          tags="$name:$version"
          if [[ "$version" != *-* ]]; then
            tags="$tags,$name:${version%.*},$name:latest"
          fi
          {
            echo "tags=$tags"
            echo "version=$version"
            echo "cache=ghcr.io/$repo/buildcache-$IMAGE"
          } >> "$GITHUB_OUTPUT"
      - name: 登入 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # 字型原檔在主機上抓（理由見 ci.yml 的 docker job：buildx 容器裡抓會被切斷）
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.image == 'frontend'
        with:
          node-version: 26
          # 發版的產物不能吃任何快取（zizmor cache-poisoning）；這步只要 node 本身
          package-manager-cache: false
      - name: 下載裁字字型原檔
        if: matrix.image == 'frontend'
        run: node scripts/fetch-serif-font.mjs .cache/serif-font/fonts
      - name: 建置並推送
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.image == 'frontend' && 'serif-font=.cache/serif-font' || '' }}
          build-args: ${{ matrix.image == 'frontend' && format('VITE_RELEASE={0}', steps.meta.outputs.version) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          # 跟 CI 共用同一份快取（只讀，不回寫：快取由 main 的 push 維護）
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          # runtime 層的 apt-get upgrade 不吃快取，理由同 ci.yml
          no-cache-filters: runtime

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 開 Release（說明自動產生）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
